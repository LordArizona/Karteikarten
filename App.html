/* ============================================================
   STORAGE-SHIM: ersetzt window.storage (nur in Claude verfügbar)
   durch echtes Browser-localStorage, gleiche Schnittstelle.
   ============================================================ */
const LOCAL_PREFIX = "abr-fc:";
window.storage = {
  async get(key) {
    try {
      const raw = localStorage.getItem(LOCAL_PREFIX + key);
      if (raw === null) return null;
      return { key, value: raw };
    } catch (e) {
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(LOCAL_PREFIX + key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
    >
      {children}
    </svg>
  );
}

const CARD_BY_ID = Object.fromEntries(CARD_DATA.map((c) => [c.id, c]));
const CAT_LABEL = Object.fromEntries(CATEGORIES.map((c) => [c.id, c.label]));

const PROGRESS_KEY = "abr-fc-progress-v1";
const SETTINGS_KEY = "abr-fc-settings-v1";
const DAY_MS = 24 * 60 * 60 * 1000;
const INTERVAL_DAYS = [0, 1, 2, 4, 7, 14, 30]; // index = box
const MASTERED_BOX = 5;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function defaultProgressFor(id) {
  return { box: 0, due: Date.now(), seen: 0, correct: 0 };
}

function RichText({ text, className }) {
  const parts = text.split(/(\*\*[^*]+\*\*)/g).filter(Boolean);
  return (
    <span className={className}>
      {parts.map((p, i) =>
        p.startsWith("**") && p.endsWith("**") ? (
          <strong key={i} className="font-semibold text-slate-900">
            {p.slice(2, -2)}
          </strong>
        ) : (
          <React.Fragment key={i}>{p}</React.Fragment>
        )
      )}
    </span>
  );
}

function App() {
  const [loading, setLoading] = useState(true);
  const [progress, setProgress] = useState({});
  const [selectedCats, setSelectedCats] = useState(CATEGORIES.map((c) => c.id));
  const [view, setView] = useState("practice"); // 'practice' | 'browse'
  const [queue, setQueue] = useState([]);
  const [flipped, setFlipped] = useState(false);
  const [sessionAnswered, setSessionAnswered] = useState(0);
  const [sessionCorrect, setSessionCorrect] = useState(0);
  const [showSettings, setShowSettings] = useState(false);
  const [confirmReset, setConfirmReset] = useState(false);
  const [expandedBrowse, setExpandedBrowse] = useState({});
  const [now, setNow] = useState(Date.now());
  const reducedMotion = useRef(false);

  useEffect(() => {
    try {
      reducedMotion.current = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (e) {}
  }, []);

  // ---- load + merge on mount ----
  useEffect(() => {
    (async () => {
      let stored = {};
      try {
        const res = await window.storage.get(PROGRESS_KEY, false);
        if (res && res.value) stored = JSON.parse(res.value);
      } catch (e) {
        stored = {};
      }
      let changed = false;
      const merged = { ...stored };
      for (const card of CARD_DATA) {
        if (!merged[card.id]) {
          merged[card.id] = defaultProgressFor(card.id);
          changed = true;
        }
      }
      setProgress(merged);
      if (changed) {
        try {
          await window.storage.set(PROGRESS_KEY, JSON.stringify(merged), false);
        } catch (e) {
          console.error("Storage error", e);
        }
      }

      let settings = null;
      try {
        const res = await window.storage.get(SETTINGS_KEY, false);
        if (res && res.value) settings = JSON.parse(res.value);
      } catch (e) {}
      if (settings && Array.isArray(settings.selectedCats) && settings.selectedCats.length > 0) {
        setSelectedCats(settings.selectedCats);
      }

      setLoading(false);
    })();
  }, []);

  const persistProgress = useCallback(async (next) => {
    try {
      await window.storage.set(PROGRESS_KEY, JSON.stringify(next), false);
    } catch (e) {
      console.error("Storage error", e);
    }
  }, []);

  const persistSettings = useCallback(async (cats) => {
    try {
      await window.storage.set(SETTINGS_KEY, JSON.stringify({ selectedCats: cats }), false);
    } catch (e) {
      console.error("Storage error", e);
    }
  }, []);

  const buildQueue = useCallback(
    (opts = {}) => {
      const ignoreDue = !!opts.ignoreDue;
      const pool = CARD_DATA.filter((c) => selectedCats.includes(c.cat));
      const due = pool.filter((c) => ignoreDue || (progress[c.id]?.due ?? 0) <= Date.now());
      setQueue(shuffle(due).map((c) => c.id));
      setFlipped(false);
      setSessionAnswered(0);
      setSessionCorrect(0);
    },
    [progress, selectedCats]
  );

  // build initial queue once progress is loaded
  useEffect(() => {
    if (!loading) buildQueue();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loading]);

  function toggleCategory(id) {
    setSelectedCats((prev) => {
      const next = prev.includes(id) ? prev.filter((c) => c !== id) : [...prev, id];
      const finalCats = next.length === 0 ? prev : next;
      persistSettings(finalCats);
      return finalCats;
    });
  }

  useEffect(() => {
    if (!loading) buildQueue();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [selectedCats]);

  const currentId = queue[0];
  const currentCard = currentId ? CARD_BY_ID[currentId] : null;

  function answer(correct) {
    if (!currentId) return;
    const prev = progress[currentId] || defaultProgressFor(currentId);
    let box = correct ? Math.min(prev.box + 1, INTERVAL_DAYS.length - 1) : 0;
    const due = correct ? Date.now() + INTERVAL_DAYS[box] * DAY_MS : Date.now();
    const nextEntry = {
      box,
      due,
      seen: prev.seen + 1,
      correct: prev.correct + (correct ? 1 : 0),
    };
    const nextProgress = { ...progress, [currentId]: nextEntry };
    setProgress(nextProgress);
    persistProgress(nextProgress);

    setSessionAnswered((n) => n + 1);
    if (correct) setSessionCorrect((n) => n + 1);

    setQueue((q) => {
      const rest = q.slice(1);
      if (!correct) {
        const insertAt = Math.min(rest.length, 3 + Math.floor(Math.random() * 3));
        rest.splice(insertAt, 0, currentId);
      }
      return rest;
    });
    setFlipped(false);
  }

  const dueCountTotal = CARD_DATA.filter(
    (c) => selectedCats.includes(c.cat) && (progress[c.id]?.due ?? 0) <= now
  ).length;
  const masteredCount = CARD_DATA.filter(
    (c) => selectedCats.includes(c.cat) && (progress[c.id]?.box ?? 0) >= MASTERED_BOX
  ).length;
  const totalInSelection = CARD_DATA.filter((c) => selectedCats.includes(c.cat)).length;

  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 30000);
    return () => clearInterval(t);
  }, []);

  return (
    <div className="min-h-screen bg-stone-100 flex flex-col items-center font-sans">
      <div className="w-full max-w-md bg-stone-100 min-h-screen flex flex-col shadow-xl">
        {/* Header */}
        <header className="bg-slate-900 text-stone-50 px-5 pt-5 pb-4 border-b-4 border-amber-600">
          <div className="flex items-start justify-between">
            <div>
              <h1 className="font-serif text-2xl tracking-tight">Karteikarten</h1>
              <p className="text-amber-300/90 text-xs mt-0.5 font-sans">ABR · bis es sitzt</p>
            </div>
            <button
              onClick={() => setShowSettings((s) => !s)}
              aria-label="Einstellungen"
              className="p-2 rounded-full text-stone-300 hover:text-white hover:bg-white/10 focus:outline-none focus:ring-2 focus:ring-amber-400"
            >
              <Settings2 size={20} />
            </button>
          </div>

          <div className="flex gap-2 mt-4">
            <button
              onClick={() => setView("practice")}
              className={`px-3 py-1.5 rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400 ${
                view === "practice" ? "bg-amber-600 text-white" : "bg-white/10 text-stone-200"
              }`}
            >
              Üben
            </button>
            <button
              onClick={() => setView("browse")}
              className={`px-3 py-1.5 rounded-full text-sm font-medium focus:outline-none focus:ring-2 focus:ring-amber-400 ${
                view === "browse" ? "bg-amber-600 text-white" : "bg-white/10 text-stone-200"
              }`}
            >
              Alle Karten
            </button>
          </div>
        </header>

        {showSettings && (
          <div className="bg-white border-b border-stone-200 px-5 py-4">
            <p className="text-xs uppercase tracking-wide text-stone-500 font-sans mb-2">Fortschritt</p>
            {!confirmReset ? (
              <button
                onClick={() => setConfirmReset(true)}
                className="text-sm text-rose-700 underline decoration-rose-300 underline-offset-2"
              >
                Fortschritt zurücksetzen
              </button>
            ) : (
              <div className="flex items-center gap-3 text-sm">
                <span className="text-stone-700">Wirklich alle Karten zurücksetzen?</span>
                <button
                  onClick={async () => {
                    const reset = {};
                    for (const c of CARD_DATA) reset[c.id] = defaultProgressFor(c.id);
                    setProgress(reset);
                    await persistProgress(reset);
                    setConfirmReset(false);
                    buildQueue();
                  }}
                  className="px-2 py-1 rounded bg-rose-700 text-white text-xs font-medium"
                >
                  Ja, zurücksetzen
                </button>
                <button
                  onClick={() => setConfirmReset(false)}
                  className="px-2 py-1 rounded bg-stone-200 text-stone-700 text-xs font-medium"
                >
                  Abbrechen
                </button>
              </div>
            )}
          </div>
        )}

        {/* Category filter */}
        <div className="px-5 py-3 bg-stone-100 flex gap-2 overflow-x-auto">
          {CATEGORIES.map((c) => (
            <button
              key={c.id}
              onClick={() => toggleCategory(c.id)}
              className={`whitespace-nowrap px-3 py-1.5 rounded-full text-xs font-medium border focus:outline-none focus:ring-2 focus:ring-slate-400 ${
                selectedCats.includes(c.id)
                  ? "bg-slate-900 text-white border-slate-900"
                  : "bg-white text-stone-600 border-stone-300"
              }`}
            >
              {c.label}
            </button>
          ))}
        </div>

        {/* Stats */}
        <div className="px-5 py-2 bg-white border-y border-stone-200 flex items-center justify-between text-sm font-mono text-stone-700">
          <span className="flex items-center gap-1.5">
            <Clock size={14} className="text-amber-700" />
            Fällig: {dueCountTotal}
          </span>
          <span className="flex items-center gap-1.5">
            <CheckCircle2 size={14} className="text-emerald-700" />
            Sitzt: {masteredCount}/{totalInSelection}
          </span>
          <span className="flex items-center gap-1.5">
            <Layers size={14} className="text-slate-500" />
            {totalInSelection}
          </span>
        </div>

        {/* Main content */}
        <main className="flex-1 px-5 py-6 flex flex-col">
          {loading ? (
            <div className="flex-1 flex items-center justify-center text-stone-400 text-sm">
              Lade Karten …
            </div>
          ) : totalInSelection === 0 ? (
            <div className="flex-1 flex items-center justify-center text-center text-stone-500 text-sm px-6">
              Wähle mindestens eine Kategorie oben aus.
            </div>
          ) : view === "browse" ? (
            <BrowseList
              cards={CARD_DATA.filter((c) => selectedCats.includes(c.cat))}
              expanded={expandedBrowse}
              setExpanded={setExpandedBrowse}
            />
          ) : !currentCard ? (
            <EmptyOrDoneState
              sessionAnswered={sessionAnswered}
              sessionCorrect={sessionCorrect}
              onPracticeAnyway={() => buildQueue({ ignoreDue: true })}
              onRefresh={() => buildQueue()}
            />
          ) : (
            <PracticeCard
              card={currentCard}
              flipped={flipped}
              onFlip={() => setFlipped(true)}
              onAnswer={answer}
              remaining={queue.length}
              categoryLabel={CAT_LABEL[currentCard.cat]}
              reducedMotion={reducedMotion.current}
              progressInfo={progress[currentCard.id]}
            />
          )}
        </main>
      </div>
    </div>
  );
}

function PracticeCard({ card, flipped, onFlip, onAnswer, remaining, categoryLabel, reducedMotion, progressInfo }) {
  const box = progressInfo?.box ?? 0;
  const seen = progressInfo?.seen ?? 0;
  return (
    <div className="flex-1 flex flex-col">
      <p className="text-xs font-mono text-stone-400 mb-1 text-center">
        {remaining} {remaining === 1 ? "Karte" : "Karten"} in dieser Runde
      </p>
      <p className="text-[10px] font-mono text-stone-300 mb-3 text-center">
        Box: {box} · gesehen: {seen}×
      </p>

      <div
        className="mx-auto w-full"
        style={{ perspective: "1200px" }}
      >
        <div
          onClick={() => !flipped && onFlip()}
          role="button"
          tabIndex={0}
          onKeyDown={(e) => {
            if ((e.key === "Enter" || e.key === " ") && !flipped) onFlip();
          }}
          className="relative w-full focus:outline-none"
          style={{
            minHeight: "260px",
            transformStyle: "preserve-3d",
            transition: reducedMotion ? "none" : "transform 0.5s",
            transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
            cursor: flipped ? "default" : "pointer",
          }}
        >
          {/* Front */}
          <div
            className="absolute inset-0 rounded-xl border border-stone-300 bg-amber-50 shadow-md flex flex-col p-5"
            style={{ backfaceVisibility: "hidden" }}
          >
            <CardChrome label={categoryLabel} />
            <div className="flex-1 flex items-center justify-center text-center px-2">
              <p className="font-serif text-lg text-slate-900 leading-snug">{card.q}</p>
            </div>
            <p className="text-center text-xs text-stone-400 font-sans mt-2">Tippen zum Umdrehen</p>
          </div>

          {/* Back */}
          <div
            className="absolute inset-0 rounded-xl border border-stone-300 bg-stone-50 shadow-md flex flex-col p-5"
            style={{ backfaceVisibility: "hidden", transform: "rotateY(180deg)" }}
          >
            <CardChrome label={categoryLabel} />
            <div className="flex-1 flex items-center justify-center text-center px-1 overflow-y-auto">
              <RichText text={card.a} className="font-serif text-base text-slate-800 leading-relaxed" />
            </div>
          </div>
        </div>
      </div>

      <div className="mt-6 flex gap-3">
        {!flipped ? (
          <button
            onClick={onFlip}
            className="w-full py-3 rounded-lg bg-slate-900 text-white font-medium focus:outline-none focus:ring-2 focus:ring-slate-500 active:scale-95 transition-transform"
          >
            Antwort zeigen
          </button>
        ) : (
          <>
            <button
              onClick={() => onAnswer(false)}
              className="flex-1 py-3 rounded-lg border-2 border-rose-700 text-rose-700 font-medium flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-rose-400 active:scale-95 transition-transform"
            >
              <RotateCcw size={16} />
              Nochmal
            </button>
            <button
              onClick={() => onAnswer(true)}
              className="flex-1 py-3 rounded-lg bg-emerald-700 text-white font-medium flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-emerald-400 active:scale-95 transition-transform"
            >
              <Check size={16} />
              Kann ich
            </button>
          </>
        )}
      </div>
    </div>
  );
}

function CardChrome({ label }) {
  return (
    <div className="flex items-center justify-between mb-3">
      <span
        className="inline-block rounded-full bg-white border border-stone-300"
        style={{ width: 14, height: 14 }}
        aria-hidden="true"
      />
      <span className="text-[10px] font-mono uppercase tracking-wider text-stone-500">{label}</span>
    </div>
  );
}

function EmptyOrDoneState({ sessionAnswered, sessionCorrect, onPracticeAnyway, onRefresh }) {
  return (
    <div className="flex-1 flex flex-col items-center justify-center text-center px-4">
      {sessionAnswered > 0 ? (
        <>
          <p className="font-serif text-xl text-slate-900 mb-1">Runde geschafft 🎉</p>
          <p className="text-stone-500 text-sm mb-6">
            {sessionCorrect} von {sessionAnswered} richtig
          </p>
        </>
      ) : (
        <>
          <p className="font-serif text-xl text-slate-900 mb-1">Für jetzt nichts fällig</p>
          <p className="text-stone-500 text-sm mb-6">Gut gemacht – schau später wieder vorbei.</p>
        </>
      )}
      <div className="flex flex-col gap-2 w-full max-w-xs">
        <button
          onClick={onPracticeAnyway}
          className="py-2.5 rounded-lg border border-stone-300 text-stone-700 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-slate-400"
        >
          Trotzdem üben
        </button>
        <button
          onClick={onRefresh}
          className="py-2.5 rounded-lg text-stone-400 text-xs"
        >
          Aktualisieren
        </button>
      </div>
    </div>
  );
}

function BrowseList({ cards, expanded, setExpanded }) {
  const byCat = {};
  for (const c of cards) {
    if (!byCat[c.cat]) byCat[c.cat] = [];
    byCat[c.cat].push(c);
  }
  return (
    <div className="space-y-6">
      {Object.entries(byCat).map(([catId, catCards]) => (
        <div key={catId}>
          <p className="text-xs uppercase tracking-wide text-amber-700 font-sans font-semibold mb-2">
            {CAT_LABEL[catId]}
          </p>
          <div className="space-y-2">
            {catCards.map((c) => {
              const isOpen = !!expanded[c.id];
              return (
                <div key={c.id} className="rounded-lg border border-stone-200 bg-white overflow-hidden">
                  <button
                    onClick={() => setExpanded((e) => ({ ...e, [c.id]: !e[c.id] }))}
                    className="w-full flex items-center justify-between px-4 py-3 text-left focus:outline-none focus:ring-2 focus:ring-inset focus:ring-slate-400"
                  >
                    <span className="font-serif text-sm text-slate-900 pr-3">{c.q}</span>
                    {isOpen ? (
                      <ChevronUp size={16} className="text-stone-400 shrink-0" />
                    ) : (
                      <ChevronDown size={16} className="text-stone-400 shrink-0" />
                    )}
                  </button>
                  {isOpen && (
                    <div className="px-4 pb-3 border-t border-stone-100 pt-2">
                      <RichText text={c.a} className="text-sm text-stone-700 leading-relaxed" />
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
