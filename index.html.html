<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ABR Karteikarten</title>
<style>
  :root {
    --navy: #1e293b; --navy-2: #0f172a;
    --gold: #b45309; --gold-light: #d97706;
    --cream: #fdf6e3; --paper: #fafaf9;
    --ink: #1c1917; --muted: #78716c; --border: #d6d3d1;
    --rose: #9f1239; --emerald: #047857;
    --shell-bg: #f0efec;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--shell-bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font-family: inherit; cursor: pointer; }
  #root { display: flex; justify-content: center; min-height: 100vh; }
  .shell {
    width: 100%; max-width: 448px; min-height: 100vh; background: var(--shell-bg);
    display: flex; flex-direction: column; box-shadow: 0 0 24px rgba(0,0,0,0.08);
  }

  header { background: var(--navy); color: #fafaf9; padding: 20px 20px 16px; border-bottom: 4px solid var(--gold); }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; }
  .app-title { font-size: 24px; margin: 0; letter-spacing: -0.01em; font-family: Georgia, serif; }
  .app-subtitle { color: #fcd34d; font-size: 12px; margin: 2px 0 0; }
  .icon-btn { background: none; border: none; color: #cbd5e1; padding: 8px; border-radius: 999px; display: flex; }
  .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .tabs { display: flex; gap: 8px; margin-top: 16px; }
  .tab-btn { padding: 7px 14px; border-radius: 999px; font-size: 14px; font-weight: 500; border: none; background: rgba(255,255,255,0.1); color: #e2e8f0; }
  .tab-btn.active { background: var(--gold-light); color: #fff; }

  .settings-panel { background: #fff; border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .settings-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 8px; }
  .link-danger { background: none; border: none; color: var(--rose); font-size: 14px; text-decoration: underline; padding: 0; }
  .confirm-row { display: flex; align-items: center; gap: 10px; font-size: 14px; flex-wrap: wrap; }
  .btn-small-danger { background: var(--rose); color: #fff; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .btn-small-neutral { background: #e7e5e4; color: #44403c; border: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; }
  .warn { font-size: 12px; color: var(--rose); margin-top: 10px; line-height: 1.5; }

  .cat-bar { padding: 10px 20px 0; display: flex; gap: 8px; align-items: center; }
  .cat-bulk { background: #fff; border: 1px solid var(--border); color: #57534e; font-size: 11px; padding: 4px 10px; border-radius: 999px; font-weight: 500; }
  .cat-count { font-size: 11px; color: var(--muted); margin-left: auto; }
  .cat-filter { padding: 8px 20px 12px; display: flex; gap: 8px; overflow-x: auto; background: var(--shell-bg); }
  .cat-chip { white-space: nowrap; padding: 7px 13px; border-radius: 999px; font-size: 12px; font-weight: 500; border: 1px solid var(--border); background: #fff; color: #57534e; flex-shrink: 0; }
  .cat-chip.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .stats-bar { padding: 8px 20px; background: #fff; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; font-size: 13px; color: #44403c; }
  .stat { display: flex; align-items: center; gap: 5px; }

  main { flex: 1; padding: 24px 20px; display: flex; flex-direction: column; }

  .queue-count { text-align: center; font-size: 12px; color: var(--muted); margin: 0 0 12px; }
  .card-outer { perspective: 1200px; width: 100%; }
  .card-inner { position: relative; width: 100%; min-height: 280px; transition: transform 0.5s; transform-style: preserve-3d; cursor: pointer; }
  .card-inner.flipped { transform: rotateY(180deg); cursor: default; }
  .card-face { position: absolute; inset: 0; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 4px 14px rgba(0,0,0,0.07); display: flex; flex-direction: column; padding: 20px; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .card-front { background: var(--cream); }
  .card-back { background: var(--paper); transform: rotateY(180deg); }
  .card-chrome { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .hole-punch { width: 14px; height: 14px; border-radius: 999px; background: #fff; border: 1px solid var(--border); }
  .cat-label { font-size: 10px; font-family: "SF Mono", Consolas, monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); text-align: right; }
  .card-body { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 4px; overflow-y: auto; }
  .card-q { font-family: Georgia, serif; font-size: 18px; color: #0c0a09; line-height: 1.4; margin: 0; }
  .card-a { font-family: Georgia, serif; font-size: 15.5px; color: #292524; line-height: 1.55; margin: 0; }
  .card-hint { text-align: center; font-size: 12px; color: #a8a29e; margin: 8px 0 0; }

  .action-row { margin-top: 24px; display: flex; gap: 12px; }
  .btn { border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 500; flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform 0.1s; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-wrong { background: #fff; color: var(--rose); border: 2px solid var(--rose); }
  .btn-correct { background: var(--emerald); color: #fff; }

  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 16px; }
  .empty-title { font-family: Georgia, serif; font-size: 20px; color: #0c0a09; margin: 0 0 4px; }
  .empty-sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .empty-actions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 260px; }
  .btn-outline { background: #fff; border: 1px solid var(--border); color: #44403c; padding: 10px; border-radius: 10px; font-size: 14px; font-weight: 500; }
  .btn-ghost { background: none; border: none; color: #a8a29e; padding: 8px; font-size: 12px; }

  .browse-group { margin-bottom: 22px; }
  .browse-group-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--gold); font-weight: 600; margin: 0 0 8px; }
  .browse-item { border: 1px solid #e7e5e4; background: #fff; border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .browse-item-q { width: 100%; background: none; border: none; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; text-align: left; gap: 10px; }
  .browse-item-q span.qtext { font-family: Georgia, serif; font-size: 14px; color: #0c0a09; }
  .browse-item-a { padding: 0 14px 12px; border-top: 1px solid #f5f5f4; }
  .browse-item-a p { font-size: 13.5px; color: #44403c; line-height: 1.55; margin: 10px 0 0; }
  .chev { flex-shrink: 0; color: #a8a29e; }

  .prog-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid #e7e5e4; font-size: 13px; }
  .prog-name { flex: 1; color: #292524; }
  .prog-bar { width: 70px; height: 6px; background: #e7e5e4; border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .prog-fill { height: 100%; background: var(--emerald); border-radius: 999px; }
  .prog-num { font-family: "SF Mono", Consolas, monospace; font-size: 11px; color: var(--muted); width: 48px; text-align: right; flex-shrink: 0; }
  .prog-due { font-family: "SF Mono", Consolas, monospace; font-size: 11px; color: var(--gold); width: 26px; text-align: right; flex-shrink: 0; }
  .prog-head { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 4px; }
  .prog-legend { font-size: 11px; color: var(--muted); margin: 14px 0 0; line-height: 1.6; }

  .loading-msg { flex: 1; display: flex; align-items: center; justify-content: center; color: #a8a29e; font-size: 14px; text-align: center; padding: 0 20px; }
  svg.icon { display: block; }
</style>
</head>

var CARD_BY_ID = {};
CARD_DATA.forEach(function (c) { CARD_BY_ID[c.id] = c; });
var CAT_LABEL = {};
CATEGORIES.forEach(function (c) { CAT_LABEL[c.id] = c.label; });

var PROGRESS_KEY = "abr_fc_progress_v1";
var SETTINGS_KEY = "abr_fc_settings_v1";
var DAY_MS = 24 * 60 * 60 * 1000;
var INTERVAL_DAYS = [0, 1, 2, 4, 7, 14, 30];
var MASTERED_BOX = 5;

function loadJSON(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) { console.error("Storage read error", e); return fallback; }
}
function saveJSON(key, value) {
  try { window.localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { console.error("Storage write error", e); return false; }
}
function defaultProgressFor() { return { box: 0, due: Date.now(), seen: 0, correct: 0 }; }

var state = {
  loading: true, progress: {},
  selectedCats: CATEGORIES.map(function (c) { return c.id; }),
  view: "practice", queue: [], flipped: false,
  sessionAnswered: 0, sessionCorrect: 0,
  showSettings: false, confirmReset: false,
  expandedBrowse: {}, storageOK: true
};

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function init() {
  var stored = loadJSON(PROGRESS_KEY, null);
  if (stored === null) { state.storageOK = saveJSON(PROGRESS_KEY, {}); stored = {}; }
  var merged = Object.assign({}, stored);
  CARD_DATA.forEach(function (c) { if (!merged[c.id]) merged[c.id] = defaultProgressFor(); });
  state.progress = merged;
  saveJSON(PROGRESS_KEY, merged);

  var settings = loadJSON(SETTINGS_KEY, null);
  if (settings && Array.isArray(settings.selectedCats) && settings.selectedCats.length > 0) {
    var known = settings.selectedCats.filter(function (id) { return CAT_LABEL[id]; });
    if (known.length > 0) state.selectedCats = known;
  }
  state.loading = false;
  buildQueue();
  render();
}

function buildQueue(opts) {
  opts = opts || {};
  var now = Date.now();
  var pool = CARD_DATA.filter(function (c) { return state.selectedCats.indexOf(c.cat) !== -1; });
  var due = pool.filter(function (c) {
    return opts.ignoreDue || (state.progress[c.id] && state.progress[c.id].due <= now);
  });
  state.queue = shuffle(due).map(function (c) { return c.id; });
  state.flipped = false;
  state.sessionAnswered = 0;
  state.sessionCorrect = 0;
}

function setCats(next) {
  if (next.length === 0) return;
  state.selectedCats = next;
  saveJSON(SETTINGS_KEY, { selectedCats: next });
  buildQueue();
  render();
}
function toggleCategory(id) {
  var idx = state.selectedCats.indexOf(id);
  var next = state.selectedCats.slice();
  if (idx === -1) next.push(id); else next.splice(idx, 1);
  setCats(next);
}

function answerCard(correct) {
  var currentId = state.queue[0];
  if (!currentId) return;
  var prev = state.progress[currentId] || defaultProgressFor();
  var box = correct ? Math.min(prev.box + 1, INTERVAL_DAYS.length - 1) : 0;
  var due = correct ? Date.now() + INTERVAL_DAYS[box] * DAY_MS : Date.now();
  state.progress[currentId] = { box: box, due: due, seen: prev.seen + 1, correct: prev.correct + (correct ? 1 : 0) };
  saveJSON(PROGRESS_KEY, state.progress);

  state.sessionAnswered += 1;
  if (correct) state.sessionCorrect += 1;

  var rest = state.queue.slice(1);
  if (!correct) {
    var insertAt = Math.min(rest.length, 3 + Math.floor(Math.random() * 3));
    rest.splice(insertAt, 0, currentId);
  }
  state.queue = rest;
  state.flipped = false;
  render();
}

function richHTML(text) {
  var esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function icon(name, size) {
  size = size || 16;
  var inner = "";
  if (name === "clock") inner = '<circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15.5 14"></polyline>';
  else if (name === "check-circle") inner = '<circle cx="12" cy="12" r="9"></circle><polyline points="8 12 11 15.5 16 9"></polyline>';
  else if (name === "layers") inner = '<polygon points="12 3 21 8.5 12 14 3 8.5 12 3"></polygon><polyline points="3 14 12 19.5 21 14"></polyline>';
  else if (name === "rotate-ccw") inner = '<path d="M3.5 12a8.5 8.5 0 1 0 2.9-6.4"></path><polyline points="3.5 4 3.5 9 8.5 9"></polyline>';
  else if (name === "check") inner = '<polyline points="20 6 9 17 4 12"></polyline>';
  else if (name === "chevron-down") inner = '<polyline points="6 9 12 15 18 9"></polyline>';
  else if (name === "chevron-up") inner = '<polyline points="6 15 12 9 18 15"></polyline>';
  return '<svg class="icon" width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
}
function gearSVG() {
  return '<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="3"></circle>' +
    '<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>';
}

function render() {
  var now = Date.now();
  var sel = CARD_DATA.filter(function (c) { return state.selectedCats.indexOf(c.cat) !== -1; });
  var dueCount = sel.filter(function (c) { return state.progress[c.id] && state.progress[c.id].due <= now; }).length;
  var masteredCount = sel.filter(function (c) { return state.progress[c.id] && state.progress[c.id].box >= MASTERED_BOX; }).length;

  var html = '<div class="shell">';
  html += '<header><div class="header-row">';
  html += '<div><h1 class="app-title">Karteikarten</h1><p class="app-subtitle">ABR &middot; bis es sitzt</p></div>';
  html += '<button class="icon-btn" data-action="toggle-settings" aria-label="Einstellungen">' + gearSVG() + '</button>';
  html += '</div><div class="tabs">';
  html += '<button class="tab-btn ' + (state.view === "practice" ? "active" : "") + '" data-action="set-view" data-view="practice">Üben</button>';
  html += '<button class="tab-btn ' + (state.view === "progress" ? "active" : "") + '" data-action="set-view" data-view="progress">Fortschritt</button>';
  html += '<button class="tab-btn ' + (state.view === "browse" ? "active" : "") + '" data-action="set-view" data-view="browse">Alle Karten</button>';
  html += '</div></header>';

  if (state.showSettings) {
    html += '<div class="settings-panel"><p class="settings-label">Fortschritt</p>';
    if (!state.confirmReset) {
      html += '<button class="link-danger" data-action="reset-ask">Fortschritt zurücksetzen</button>';
    } else {
      html += '<div class="confirm-row"><span>Wirklich alle Karten zurücksetzen?</span>';
      html += '<button class="btn-small-danger" data-action="reset-confirm">Ja, zurücksetzen</button>';
      html += '<button class="btn-small-neutral" data-action="reset-cancel">Abbrechen</button></div>';
    }
    if (!state.storageOK) {
      html += '<p class="warn">Hinweis: Der Browser blockiert hier lokalen Speicher (z. B. in einer Vorschau) &ndash; der Fortschritt wird gerade nicht gespeichert. Als heruntergeladene Datei oder gehostet funktioniert es normal.</p>';
    }
    html += '</div>';
  }

  html += '<div class="cat-bar">';
  html += '<button class="cat-bulk" data-action="cats-all">Alle</button>';
  html += '<button class="cat-bulk" data-action="cats-none">Nur erste</button>';
  html += '<span class="cat-count">' + state.selectedCats.length + '/' + CATEGORIES.length + ' Themen</span>';
  html += '</div><div class="cat-filter">';
  CATEGORIES.forEach(function (c) {
    var active = state.selectedCats.indexOf(c.id) !== -1;
    html += '<button class="cat-chip ' + (active ? "active" : "") + '" data-action="toggle-cat" data-cat="' + c.id + '">' + c.label + '</button>';
  });
  html += '</div>';

  html += '<div class="stats-bar">';
  html += '<span class="stat">' + icon("clock", 14) + ' Fällig: ' + dueCount + '</span>';
  html += '<span class="stat">' + icon("check-circle", 14) + ' Sitzt: ' + masteredCount + '/' + sel.length + '</span>';
  html += '<span class="stat">' + icon("layers", 14) + ' ' + sel.length + '</span>';
  html += '</div><main>';

  if (state.loading) html += '<div class="loading-msg">Lade Karten &hellip;</div>';
  else if (sel.length === 0) html += '<div class="loading-msg">Wähle mindestens ein Thema oben aus.</div>';
  else if (state.view === "progress") html += renderProgress();
  else if (state.view === "browse") html += renderBrowse();
  else if (!state.queue[0]) html += renderEmptyOrDone();
  else html += renderPracticeCard();

  html += '</main></div>';
  document.getElementById("root").innerHTML = html;
}

function renderPracticeCard() {
  var card = CARD_BY_ID[state.queue[0]];
  var remaining = state.queue.length;
  var h = '<p class="queue-count">' + remaining + (remaining === 1 ? ' Karte' : ' Karten') + ' in dieser Runde</p>';
  h += '<div class="card-outer"><div class="card-inner ' + (state.flipped ? "flipped" : "") + '" data-action="flip-card" tabindex="0" role="button">';
  h += '<div class="card-face card-front"><div class="card-chrome"><span class="hole-punch"></span><span class="cat-label">' + CAT_LABEL[card.cat] + '</span></div>';
  h += '<div class="card-body"><p class="card-q">' + richHTML(card.q) + '</p></div>';
  h += '<p class="card-hint">Tippen zum Umdrehen</p></div>';
  h += '<div class="card-face card-back"><div class="card-chrome"><span class="hole-punch"></span><span class="cat-label">' + CAT_LABEL[card.cat] + '</span></div>';
  h += '<div class="card-body"><p class="card-a">' + richHTML(card.a) + '</p></div></div>';
  h += '</div></div><div class="action-row">';
  if (!state.flipped) {
    h += '<button class="btn btn-primary" data-action="flip-card">Antwort zeigen</button>';
  } else {
    h += '<button class="btn btn-wrong" data-action="answer" data-correct="false">' + icon("rotate-ccw", 16) + ' Nochmal</button>';
    h += '<button class="btn btn-correct" data-action="answer" data-correct="true">' + icon("check", 16) + ' Kann ich</button>';
  }
  return h + '</div>';
}

function renderEmptyOrDone() {
  var h = '<div class="empty-state">';
  if (state.sessionAnswered > 0) {
    h += '<p class="empty-title">Runde geschafft &#127881;</p>';
    h += '<p class="empty-sub">' + state.sessionCorrect + ' von ' + state.sessionAnswered + ' richtig</p>';
  } else {
    h += '<p class="empty-title">Für jetzt nichts fällig</p>';
    h += '<p class="empty-sub">Gut gemacht &ndash; schau später wieder vorbei.</p>';
  }
  h += '<div class="empty-actions">';
  h += '<button class="btn-outline" data-action="practice-anyway">Trotzdem üben</button>';
  h += '<button class="btn-ghost" data-action="refresh-queue">Aktualisieren</button>';
  return h + '</div></div>';
}

function renderProgress() {
  var now = Date.now();
  var h = '<p class="prog-head">Thema &middot; gelernt &middot; fällig</p>';
  CATEGORIES.forEach(function (cat) {
    var cards = CARD_DATA.filter(function (c) { return c.cat === cat.id; });
    if (!cards.length) return;
    var mastered = cards.filter(function (c) { return state.progress[c.id] && state.progress[c.id].box >= MASTERED_BOX; }).length;
    var touched = cards.filter(function (c) { return state.progress[c.id] && state.progress[c.id].seen > 0; }).length;
    var due = cards.filter(function (c) { return state.progress[c.id] && state.progress[c.id].due <= now; }).length;
    var pct = Math.round((touched / cards.length) * 100);
    h += '<div class="prog-row"><span class="prog-name">' + cat.label + '</span>';
    h += '<span class="prog-bar"><span class="prog-fill" style="width:' + pct + '%"></span></span>';
    h += '<span class="prog-num">' + mastered + '/' + cards.length + '</span>';
    h += '<span class="prog-due">' + (due || "") + '</span></div>';
  });
  h += '<p class="prog-legend">Balken: Anteil der Karten, die du mindestens einmal beantwortet hast. Zahl: Karten, die sitzen (5× richtig in Folge). Rechts: aktuell fällige Karten.</p>';
  return h;
}

function renderBrowse() {
  var byCat = {}, order = [];
  CARD_DATA.forEach(function (c) {
    if (state.selectedCats.indexOf(c.cat) === -1) return;
    if (!byCat[c.cat]) { byCat[c.cat] = []; order.push(c.cat); }
    byCat[c.cat].push(c);
  });
  var h = "";
  order.forEach(function (catId) {
    h += '<div class="browse-group"><p class="browse-group-label">' + CAT_LABEL[catId] + '</p>';
    byCat[catId].forEach(function (c) {
      var open = !!state.expandedBrowse[c.id];
      h += '<div class="browse-item"><button class="browse-item-q" data-action="toggle-browse" data-id="' + c.id + '">';
      h += '<span class="qtext">' + richHTML(c.q) + '</span>';
      h += '<span class="chev">' + icon(open ? "chevron-up" : "chevron-down", 16) + '</span></button>';
      if (open) h += '<div class="browse-item-a"><p>' + richHTML(c.a) + '</p></div>';
      h += '</div>';
    });
    h += '</div>';
  });
  return h;
}

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var a = el.getAttribute("data-action");
  if (a === "toggle-settings") { state.showSettings = !state.showSettings; state.confirmReset = false; render(); }
  else if (a === "set-view") { state.view = el.getAttribute("data-view"); render(); }
  else if (a === "toggle-cat") toggleCategory(el.getAttribute("data-cat"));
  else if (a === "cats-all") setCats(CATEGORIES.map(function (c) { return c.id; }));
  else if (a === "cats-none") setCats([CATEGORIES[0].id]);
  else if (a === "reset-ask") { state.confirmReset = true; render(); }
  else if (a === "reset-cancel") { state.confirmReset = false; render(); }
  else if (a === "reset-confirm") {
    var reset = {};
    CARD_DATA.forEach(function (c) { reset[c.id] = defaultProgressFor(); });
    state.progress = reset; saveJSON(PROGRESS_KEY, reset);
    state.confirmReset = false; buildQueue(); render();
  }
  else if (a === "flip-card") { if (!state.flipped) { state.flipped = true; render(); } }
  else if (a === "answer") answerCard(el.getAttribute("data-correct") === "true");
  else if (a === "practice-anyway") { buildQueue({ ignoreDue: true }); render(); }
  else if (a === "refresh-queue") { buildQueue(); render(); }
  else if (a === "toggle-browse") {
    var id = el.getAttribute("data-id");
    state.expandedBrowse[id] = !state.expandedBrowse[id];
    render();
  }
});

document.addEventListener("keydown", function (e) {
  if (e.key !== "Enter" && e.key !== " ") return;
  var el = e.target.closest('[data-action="flip-card"]');
  if (el && !state.flipped) { e.preventDefault(); state.flipped = true; render(); }
});

init();
</script>
</body>
</html>
